version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: promptloop-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ALLOW_CLOUD=true
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - INFERENCE_PROVIDER=${INFERENCE_PROVIDER:-openrouter}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - promptloop-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: promptloop-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - promptloop-network

networks:
  promptloop-network:
    driver: bridge
